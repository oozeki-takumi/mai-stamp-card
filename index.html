<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>まいちゃんスタンプカード</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">まいちゃんスタンプカード</h1>
    </header>

    <main class="cards-wrapper">
      <!-- おうちスタンプ -->
      <section class="stamp-card">
        <h2 class="card-title">🏠 おうちスタンプ</h2>
        <div class="stamp-list" id="homeStamps"></div>
      </section>

      <!-- 一緒スタンプ -->
      <section class="stamp-card">
        <h2 class="card-title">💕 一緒スタンプ</h2>
        <div class="stamp-list" id="togetherStamps"></div>
      </section>
    </main>

    <!-- 管理者パネル -->
    <div class="admin-panel" id="adminPanel" style="display:none">
      <div id="pendingRequests"></div>
      <div class="admin-resets">
        <button class="btn-reset" id="btnResetHome">おうちリセット</button>
        <button class="btn-reset" id="btnResetTogether">一緒リセット</button>
      </div>
    </div>

    <!-- 完了モーダル -->
    <div class="modal-overlay" id="modal" style="display:none">
      <div class="modal-box">
        <div class="modal-emoji">🎉</div>
        <p class="modal-text" id="modalText">おめでとう！<br>コンプリート！</p>
        <button class="modal-close" id="modalClose">とじる</button>
      </div>
    </div>

    <!-- キラキラパーティクル -->
    <div id="particles"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
