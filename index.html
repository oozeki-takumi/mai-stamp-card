<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>まいちゃんスタンプカード</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- BGM -->
  <audio id="bgm" src="/BGM.mp3" loop></audio>

  <!-- 起動オーバーレイ -->
  <div id="startOverlay">
    <div id="startBox">
      <div class="start-hamster">🐹</div>
      <div class="start-name">だいふく</div>
      <p class="start-msg">アプリを起動します</p>
      <button id="btnStart">タップしてはじめる ▶</button>
    </div>
  </div>

  <div id="app">
    <header class="header">
      <h1 class="title">まいちゃんスタンプカード</h1>
    </header>

    <main class="cards-wrapper">
      <!-- タブ切り替え -->
      <div class="card-tabs">
        <button class="tab-btn active" data-card="home_card">🏠 おうちスタンプ</button>
        <button class="tab-btn" data-card="together_card">💕 一緒スタンプ</button>
      </div>

      <!-- カード表示エリア -->
      <section class="stamp-card">
        <div class="stamp-grid" id="homeStamps"></div>
        <div class="stamp-grid hidden" id="togetherStamps"></div>
        <!-- 提出ボタン (全スタンプ達成時に表示) -->
        <div id="submitArea" class="hidden">
          <button class="btn-submit" id="btnSubmit">🎉 提出する！</button>
        </div>
      </section>
    </main>

    <!-- ハムスターセクション -->
    <section class="hamster-section">
      <div class="hamster-name-title">🐹 だいふく</div>
      <div class="hamster-arena" id="hamsterArena">
        <div class="sleep-overlay" id="sleepOverlay">😴 おやすみ中…</div>
        <div class="speech-bubble" id="speechBubble">ちゅっちゅ！</div>
        <div class="hamster-x" id="hamsterX">
          <div class="hamster-y">
            <img class="hamster-sprite" id="hamsterSprite" src="/hamster.png" alt="ハムスター"/>
          </div>
        </div>
      </div>

      <!-- ステータス -->
      <div class="hamster-stats">
        <div class="stat-row">
          <span class="stat-item">💰 <span id="coinsDisplay">0</span> コイン</span>
        </div>
        <div class="hunger-row">
          <span class="hunger-label">🍽️ お腹</span>
          <div class="hunger-bar-track">
            <div class="hunger-bar-fill" id="hungerBarFill"></div>
          </div>
          <span class="hunger-count" id="hungerCount">10/24</span>
        </div>
      </div>

      <!-- アイテム欄 + ショップボタン -->
      <div class="item-bag">
        <div class="item-bag-header">
          <span class="item-bag-title">🎒 アイテム欄</span>
          <button class="btn-shop" id="btnShop">🌻 ショップ</button>
        </div>
        <div class="item-list" id="itemList">
          <p class="item-empty">アイテムなし</p>
        </div>
      </div>

      <!-- チャット -->
      <div class="hamster-chat">
        <input class="chat-input" id="chatInput" type="text" placeholder="話しかける…" maxlength="100" />
        <button class="btn-chat-send" id="btnChatSend">送信</button>
      </div>
    </section>

    <!-- 管理者パネル -->
    <div class="admin-panel" id="adminPanel" style="display:none">
      <div id="pendingRequests"></div>
      <div class="admin-resets">
        <button class="btn-reset" id="btnResetHome">おうちリセット</button>
        <button class="btn-reset" id="btnResetTogether">一緒リセット</button>
        <button class="btn-reset btn-add-coins" id="btnAddCoins">💰 1000コイン追加</button>
        <button class="btn-reset btn-reset-coins" id="btnResetCoins">💰 コインを0にリセット</button>
      </div>
    </div>

    <!-- コインゲットモーダル -->
    <div class="modal-overlay" id="modal" style="display:none">
      <div class="modal-box">
        <div class="modal-emoji">🎉</div>
        <p class="modal-text" id="modalText">1000コインゲット！</p>
        <button class="modal-close" id="modalClose">やった！</button>
      </div>
    </div>

    <!-- ショップモーダル -->
    <div class="shop-modal" id="shopModal" style="display:none">
      <div class="shop-box">
        <h3 class="shop-title">🌻 ひまわりショップ</h3>
        <p class="shop-coins">所持コイン：💰 <span id="shopCoinsDisplay">0</span></p>
        <div class="shop-item-list">
          <div class="shop-item">
            <div class="shop-item-info">
              <span class="shop-item-name">🌱 ひまわりの種（小）</span>
              <span class="shop-item-effect">★ +8 回復</span>
            </div>
            <div class="shop-item-buy">
              <span class="shop-item-price">100コイン</span>
              <button class="btn-buy-seed" data-key="seedSmall" data-price="100">買う</button>
            </div>
          </div>
          <div class="shop-item">
            <div class="shop-item-info">
              <span class="shop-item-name">🌿 ひまわりの種（中）</span>
              <span class="shop-item-effect">★ +15 回復</span>
            </div>
            <div class="shop-item-buy">
              <span class="shop-item-price">200コイン</span>
              <button class="btn-buy-seed" data-key="seedMedium" data-price="200">買う</button>
            </div>
          </div>
          <div class="shop-item">
            <div class="shop-item-info">
              <span class="shop-item-name">🌻 ひまわりの種（大）</span>
              <span class="shop-item-effect">★ +24 回復</span>
            </div>
            <div class="shop-item-buy">
              <span class="shop-item-price">300コイン</span>
              <button class="btn-buy-seed" data-key="seedLarge" data-price="300">買う</button>
            </div>
          </div>
        </div>
        <button class="btn-shop-close" id="btnShopClose">閉じる</button>
      </div>
    </div>

    <!-- キラキラパーティクル -->
    <div id="particles"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
